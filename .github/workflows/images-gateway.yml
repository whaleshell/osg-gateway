name: images-gateway

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/images-gateway.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/images-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/zorneth/osg/gateway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          path: osg-gateway
      - name: Checkout deps
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: osg-core
      - uses: actions/checkout@v4
        with:
          repository: zorneth/osg-providers
          path: osg-providers
      - uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: osg-runtime
      - uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: osg-proxy
      - uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: osg-driver
      - uses: actions/checkout@v4
        with:
          repository: zorneth/osg-sdk
          path: osg-sdk

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: osg-gateway/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
