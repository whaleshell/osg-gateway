# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - name: Write go.work
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - name: Write go.work
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: whaleshell-gateway
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - name: Write go.work
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: whaleshell-gateway
    steps:

      - name: Checkout whaleshell-gateway
        uses: actions/checkout@v4
        with:
          path: whaleshell-gateway

      - name: Checkout whaleshell-core
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-core
          path: whaleshell-core
          ref: main

      - name: Checkout whaleshell-providers
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-providers
          path: whaleshell-providers
          ref: main

      - name: Checkout whaleshell-runtime
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-runtime
          path: whaleshell-runtime
          ref: main

      - name: Checkout whaleshell-driver
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-driver
          path: whaleshell-driver
          ref: main

      - name: Checkout whaleshell-proxy
        uses: actions/checkout@v4
        with:
          repository: zorneth/osg-proxy
          path: whaleshell-proxy
          ref: main

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: zorneth/slogx
          path: slogx
      - name: Write go.work
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in whaleshell-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in whaleshell-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/whaleshell/${d} v0.1.0-alpha.1 => ./$d"
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/whaleshell/slogx v0.1.0-alpha.1 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
